<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020711" />
    <title>MYSTIX // DEMO</title>
    <link rel="stylesheet" href="src/styles.css?v=bounded-logo-20261021" />
    <style>
      #intro-music-toggle { position:fixed;top:16px;right:16px;z-index:7;border:1px solid #4fa9ff88;border-radius:6px;padding:10px 13px;background:#020711e8;color:#b8e5ff;font:11px "Space Mono",monospace;cursor:pointer; }
      #intro-music-toggle:focus-visible { outline:2px solid #b8e5ff;outline-offset:3px; }
    </style>
    <link rel="preload" as="audio" href="https://ladalab.com/src/audio/elysium-intro-fast.mp3" type="audio/mpeg" />
  </head>
  <body>
    <audio autoplay id="intro-music" src="https://ladalab.com/src/audio/elysium-intro-fast.mp3" preload="auto" loop aria-label="Elysium by Jester of Sanity"></audio>
    <button id="intro-music-toggle" type="button" aria-pressed="false" title="Elysium — Jester / Sanity, 1991">♫ PLAY MUSIC</button>
    <script src="src/intro-music.js?v=early-start-20261021"></script>
    <main class="demo-frame" id="demoFrame">
      <canvas id="starfield" aria-hidden="true"></canvas>
      <div class="crt-lines" aria-hidden="true"></div>
      <div class="decompression-screen" id="decompressionScreen" aria-hidden="true"></div>
      <section class="logo-stage" aria-label="MYSTIX demo logo">
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <div class="logo-glow"></div>
        <span class="orbit-sphere sphere-cyan" aria-hidden="true"></span>
        <span class="orbit-sphere sphere-violet" aria-hidden="true"></span>
        <img class="demo-logo" src="src/logo.jpeg" alt="MYSTIX 2.0" />
      </section>
      <footer class="demo-footer">
        <div class="scroll-window" aria-label="Demo scrolling message"><div class="scroll-track" id="scrollTrack">LOADING SCROLLTEXT...</div></div>
      </footer>
    </main>
    <script src="src/app.js?v=efficient-render-20261021"></script>
  </body>
</html>
